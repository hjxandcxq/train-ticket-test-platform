# 无 MySQL 时的本地演示/冒烟模式：
#   java -jar target/train-ticket-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
# 数据在内存里，进程退出即清空；正式压测请用 MySQL profile。
spring:
  datasource:
    url: jdbc:h2:mem:train_ticket;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  seed-demo: true
