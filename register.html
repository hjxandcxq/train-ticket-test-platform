<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 — 火车票预订系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>注册账号</h1>
    <p class="subtitle">用户名 4-20 位字母/数字/下划线，密码 6-20 位且包含字母和数字</p>

    <div class="msg error" th:if="${error}" th:text="${error}">错误提示</div>

    <form method="post" action="/register">
        <div class="field">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" th:value="${username}"
                   placeholder="4-20 位" autocomplete="username">
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password"
                   placeholder="6-20 位，含字母和数字" autocomplete="new-password">
        </div>
        <div class="field">
            <label for="confirm">确认密码</label>
            <input type="password" id="confirm" name="confirm"
                   placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <button type="submit" id="btn-register">注册</button>
    </form>

    <p class="links">已有账号？<a th:href="@{/login}">返回登录</a></p>
</div>
</body>
</html>
